# IoT Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mvan-pee-app
  namespace: dev
  labels:
    app: iot-app
    project: inception-of-things
    author: mvan-pee
spec:
  replicas: 1

  selector:
    matchLabels:
      app: iot-app

  template:
    metadata:
      labels:
        app: iot-app
        version: v1

    spec:
      containers:
      - name: iot-app
        # Change v1 to v2 to update application version
        image: mvan-pee/iot-app:v1
        imagePullPolicy: Always

        ports:
        - containerPort: 8888
          name: http
          protocol: TCP

        # Guaranteed minimum and maximum resources
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"

        # Restart container if health check fails
        livenessProbe:
          httpGet:
            path: /health
            port: 8888
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Remove from Service if not ready
        readinessProbe:
          httpGet:
            path: /health
            port: 8888
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
